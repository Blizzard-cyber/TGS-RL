name: "${COMPOSE_PROJECT_NAME:-tgsrl-local}"

x-tgsrl-build-args: &tgsrl-build-args
  TGSRL_GO_BASE_IMAGE: "${TGSRL_GO_BASE_IMAGE:-golang:1.26.4-bookworm@sha256:b305420a68d0f229d91eb3b3ed9e519fcf2cf5461da4bef997bf927e8c0bfd2b}"
  TGSRL_PYTHON_BASE_IMAGE: "${TGSRL_PYTHON_BASE_IMAGE:-python:3.12.14-slim-bookworm@sha256:0f5b26b9518d002b6173fd61daad821fa340635ebfec5bba471013f9ca114579}"
  TGSRL_NODE_BASE_IMAGE: "${TGSRL_NODE_BASE_IMAGE:-node:24.20.0-bookworm-slim@sha256:ba849c60be29959425b8734d57b8b4b7d56f98edd9504c9af091d5281095a71e}"
  TGSRL_GOPROXY: "${TGSRL_GOPROXY:-https://proxy.golang.org,direct}"
  TGSRL_PYPI_INDEX_URL: "${TGSRL_PYPI_INDEX_URL:-https://pypi.org/simple}"
  TGSRL_NPM_REGISTRY: "${TGSRL_NPM_REGISTRY:-https://registry.npmjs.org}"

# Complete local product stack. It exercises the production control flow while
# replacing external hardware and Kubernetes with deterministic local backends.
services:
  scheduler:
    image: "tgsrl-go-service:local"
    build:
      context: .
      dockerfile: Dockerfile.local
      target: go-service
      args: *tgsrl-build-args
    working_dir: /workspace
    command:
      - go
      - run
      - ./scheduler-go/cmd/scheduler
      - -listen
      - 0.0.0.0:50051
      - -config-root
      - /workspace
      - -state-dir
      - /state
      - -metrics-listen
      - 0.0.0.0:9090
    environment:
      CGO_ENABLED: "0"
    volumes:
      - ./go.mod:/workspace/go.mod:ro
      - ./go.sum:/workspace/go.sum:ro
      - ./compatibility:/workspace/compatibility:ro
      - ./configs:/workspace/configs:ro
      - ./gen/go:/workspace/gen/go:ro
      - ./internal:/workspace/internal:ro
      - ./scheduler-go:/workspace/scheduler-go:ro
      - ./storage:/workspace/storage:ro
      - ./upstream:/workspace/upstream:ro
      - scheduler-state:/state
    ports:
      - "127.0.0.1:50051:50051"
      - "127.0.0.1:9090:9090"
    healthcheck:
      test: ["CMD-SHELL", "bash -ec 'exec 3<>/dev/tcp/127.0.0.1/50051'"]
      interval: 1s
      timeout: 1s
      retries: 60
      start_period: 10s
    init: true

  runtime:
    image: "tgsrl-python:local"
    build:
      context: .
      dockerfile: Dockerfile.local
      target: python-service
      args: *tgsrl-build-args
    working_dir: /workspace
    environment:
      # Development-only HMAC shared with compose-smoke.py. Override this value
      # when exercising a custom local worker registry.
      TGSRL_WORKER_REGISTRY_SIGNING_KEY: "${TGSRL_WORKER_REGISTRY_SIGNING_KEY:-tgsrl-local-worker-trace-signing-key-v1}"
    command:
      - /bin/sh
      - -ceu
      - |
        PYTHONPATH=/workspace:/workspace/runtime-python:/workspace/gateway-python:/workspace/gen/python \
          python -m tgsrl_runtime.runtime_app \
          --bind 0.0.0.0:50071 \
          --scheduler-target scheduler:50051 \
          --operator-target operator:50081 \
          --job-control-target job-controller:50061 \
          --state-db /state/runtime.db \
          --config-root /workspace
    volumes:
      - ./pyproject.toml:/workspace/pyproject.toml:ro
      - ./uv.lock:/workspace/uv.lock:ro
      - ./adapters:/workspace/adapters:ro
      - ./compatibility:/workspace/compatibility:ro
      - ./configs:/workspace/configs:ro
      - ./gateway-python:/workspace/gateway-python:ro
      - ./gen/python:/workspace/gen/python:ro
      - ./runtime-python:/workspace/runtime-python:ro
      - ./upstream:/workspace/upstream:ro
      - runtime-state:/state
    ports:
      - "127.0.0.1:50071:50071"
    depends_on:
      scheduler:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - python -c 'import socket; s=socket.create_connection(("127.0.0.1",50071),1); s.close()'
      interval: 1s
      timeout: 2s
      retries: 60
      start_period: 20s
    init: true

  job-controller:
    image: "tgsrl-go-service:local"
    build:
      context: .
      dockerfile: Dockerfile.local
      target: go-service
      args: *tgsrl-build-args
    working_dir: /workspace
    command:
      - go
      - run
      - ./job-controller-go/cmd/job-controller
      - -listen
      - 0.0.0.0:50061
      - -runtime-target
      - runtime:50071
      - -state-dir
      - /state
    environment:
      CGO_ENABLED: "0"
    volumes:
      - ./go.mod:/workspace/go.mod:ro
      - ./go.sum:/workspace/go.sum:ro
      - ./gen/go:/workspace/gen/go:ro
      - ./job-controller-go:/workspace/job-controller-go:ro
      - ./storage:/workspace/storage:ro
      - controller-state:/state
    ports:
      - "127.0.0.1:50061:50061"
    depends_on:
      runtime:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -ec 'exec 3<>/dev/tcp/127.0.0.1/50061'"]
      interval: 1s
      timeout: 1s
      retries: 60
      start_period: 10s
    init: true

  operator:
    image: "tgsrl-go-service:local"
    build:
      context: .
      dockerfile: Dockerfile.local
      target: go-service
      args: *tgsrl-build-args
    working_dir: /workspace
    command:
      - go
      - run
      - ./cmd/operator
      - -mode
      - fake
      - -listen
      - 0.0.0.0:50081
      - -scheduler
      - scheduler:50051
      - -control
      - job-controller:50061
      - -runtime
      - runtime:50071
      - -cursor-dir
      - /state
    environment:
      CGO_ENABLED: "0"
    volumes:
      - ./cmd:/workspace/cmd:ro
      - ./gen/go:/workspace/gen/go:ro
      - ./go.mod:/workspace/go.mod:ro
      - ./go.sum:/workspace/go.sum:ro
      - ./internal:/workspace/internal:ro
      - ./operator-go:/workspace/operator-go:ro
      - operator-state:/state
    ports:
      - "127.0.0.1:50081:50081"
    depends_on:
      job-controller:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -ec 'exec 3<>/dev/tcp/127.0.0.1/50081'"]
      interval: 1s
      timeout: 1s
      retries: 60
      start_period: 10s
    init: true

  gateway:
    image: "tgsrl-python:local"
    build:
      context: .
      dockerfile: Dockerfile.local
      target: python-service
      args: *tgsrl-build-args
    working_dir: /workspace
    command:
      - /bin/sh
      - -ceu
      - |
        PYTHONPATH=/workspace:/workspace/runtime-python:/workspace/gateway-python:/workspace/gen/python \
          python -m tgsrl_gateway serve \
          --host 0.0.0.0 --port 8080 --backend-mode grpc \
          --job-control-target job-controller:50061 \
          --scheduler-target scheduler:50051 \
          --runtime-target runtime:50071 \
          --experiment-target runtime:50071
    volumes:
      - ./pyproject.toml:/workspace/pyproject.toml:ro
      - ./uv.lock:/workspace/uv.lock:ro
      - ./gateway-python:/workspace/gateway-python:ro
      - ./gen/python:/workspace/gen/python:ro
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      operator:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - python -c 'import urllib.request; urllib.request.urlopen("http://127.0.0.1:8080/health", timeout=2)'
      interval: 1s
      timeout: 3s
      retries: 60
      start_period: 20s
    init: true

  console:
    image: "tgsrl-console:local"
    build:
      context: .
      dockerfile: Dockerfile.local
      target: console
      args: *tgsrl-build-args
    working_dir: /workspace/console
    command:
      - /bin/sh
      - -ceu
      - exec npm run dev -- --host 0.0.0.0
    environment:
      VITE_TGSRL_API_ADAPTER: http
      VITE_TGSRL_GATEWAY_TARGET: http://gateway:8080
    ports:
      - "127.0.0.1:4173:4173"
    depends_on:
      gateway:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:4173').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 1s
      timeout: 2s
      retries: 60
      start_period: 5s
    init: true

  # Optional Docker-only verification runner. It is excluded from normal
  # `docker compose up` and uses the already-running six-service stack.
  smoke:
    profiles: ["tools"]
    image: "tgsrl-python:local"
    build:
      context: .
      dockerfile: Dockerfile.local
      target: python-service
      args: *tgsrl-build-args
    working_dir: /workspace
    environment:
      PYTHONPATH: /workspace:/workspace/runtime-python:/workspace/gateway-python:/workspace/gen/python
      TGSRL_WORKER_REGISTRY_SIGNING_KEY: "${TGSRL_WORKER_REGISTRY_SIGNING_KEY:-tgsrl-local-worker-trace-signing-key-v1}"
    command:
      - python
      - /workspace/scripts/compose-smoke.py
      - --base-url
      - http://console:4173
      - --scheduler-target
      - scheduler:50051
      - --runtime-target
      - runtime:50071
    volumes:
      - ./pyproject.toml:/workspace/pyproject.toml:ro
      - ./uv.lock:/workspace/uv.lock:ro
      - ./adapters:/workspace/adapters:ro
      - ./configs:/workspace/configs:ro
      - ./gateway-python:/workspace/gateway-python:ro
      - ./gen/python:/workspace/gen/python:ro
      - ./runtime-python:/workspace/runtime-python:ro
      - ./scripts:/workspace/scripts:ro
    depends_on:
      console:
        condition: service_healthy
    init: true

volumes:
  scheduler-state: {}
  controller-state: {}
  runtime-state: {}
  operator-state: {}
