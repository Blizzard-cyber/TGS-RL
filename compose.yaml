name: tgsrl-local

# Complete local product stack. It exercises the production control flow while
# replacing external hardware and Kubernetes with deterministic local backends.
services:
  scheduler:
    image: "golang:1.23.0-bookworm@sha256:32096e84705b30bb39cc9c65ef2896efacc4268203b7876049847763cefc934d"
    working_dir: /workspace
    command:
      - go
      - run
      - ./scheduler-go/cmd/scheduler
      - -listen
      - 0.0.0.0:50051
      - -config-root
      - /workspace
      - -state-dir
      - /state
      - -metrics-listen
      - 0.0.0.0:9090
    environment:
      CGO_ENABLED: "0"
    volumes:
      - ./go.mod:/workspace/go.mod:ro
      - ./go.sum:/workspace/go.sum:ro
      - ./compatibility:/workspace/compatibility:ro
      - ./configs:/workspace/configs:ro
      - ./gen/go:/workspace/gen/go:ro
      - ./scheduler-go:/workspace/scheduler-go:ro
      - scheduler-state:/state
      - go-build-cache:/root/.cache/go-build
      - go-module-cache:/go/pkg/mod
    ports:
      - "127.0.0.1:50051:50051"
      - "127.0.0.1:9090:9090"
    healthcheck:
      test: ["CMD-SHELL", "bash -ec 'exec 3<>/dev/tcp/127.0.0.1/50051'"]
      interval: 1s
      timeout: 1s
      retries: 60
      start_period: 10s
    init: true

  runtime:
    image: "python:3.12.14-slim-bookworm@sha256:0f5b26b9518d002b6173fd61daad821fa340635ebfec5bba471013f9ca114579"
    working_dir: /workspace
    command:
      - /bin/sh
      - -ceu
      - |
        python -m venv /tmp/tgsrl-venv
        /tmp/tgsrl-venv/bin/python -m pip install --disable-pip-version-check uv==0.11.30
        export UV_PROJECT_ENVIRONMENT=/tmp/tgsrl-project-venv
        /tmp/tgsrl-venv/bin/uv sync --frozen --no-dev --no-install-project
        PYTHONPATH=/workspace:/workspace/runtime-python:/workspace/gateway-python:/workspace/gen/python \
          /tmp/tgsrl-venv/bin/uv run --frozen --no-dev --no-sync \
          python -m tgsrl_runtime.runtime_app \
          --bind 0.0.0.0:50071 \
          --scheduler-target scheduler:50051 \
          --operator-target operator:50081 \
          --job-control-target job-controller:50061 \
          --state-db /state/runtime.db \
          --config-root /workspace
    volumes:
      - ./pyproject.toml:/workspace/pyproject.toml:ro
      - ./uv.lock:/workspace/uv.lock:ro
      - ./adapters:/workspace/adapters:ro
      - ./compatibility:/workspace/compatibility:ro
      - ./configs:/workspace/configs:ro
      - ./gateway-python:/workspace/gateway-python:ro
      - ./gen/python:/workspace/gen/python:ro
      - ./runtime-python:/workspace/runtime-python:ro
      - runtime-state:/state
      - uv-cache:/root/.cache/uv
    ports:
      - "127.0.0.1:50071:50071"
    depends_on:
      scheduler:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - python -c 'import socket; s=socket.create_connection(("127.0.0.1",50071),1); s.close()'
      interval: 1s
      timeout: 2s
      retries: 60
      start_period: 20s
    init: true

  job-controller:
    image: "golang:1.23.0-bookworm@sha256:32096e84705b30bb39cc9c65ef2896efacc4268203b7876049847763cefc934d"
    working_dir: /workspace
    command:
      - go
      - run
      - ./job-controller-go/cmd/job-controller
      - -listen
      - 0.0.0.0:50061
      - -runtime-target
      - runtime:50071
      - -state-dir
      - /state
    environment:
      CGO_ENABLED: "0"
    volumes:
      - ./go.mod:/workspace/go.mod:ro
      - ./go.sum:/workspace/go.sum:ro
      - ./gen/go:/workspace/gen/go:ro
      - ./job-controller-go:/workspace/job-controller-go:ro
      - controller-state:/state
      - go-build-cache:/root/.cache/go-build
      - go-module-cache:/go/pkg/mod
    ports:
      - "127.0.0.1:50061:50061"
    depends_on:
      runtime:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -ec 'exec 3<>/dev/tcp/127.0.0.1/50061'"]
      interval: 1s
      timeout: 1s
      retries: 60
      start_period: 10s
    init: true

  operator:
    image: "golang:1.23.0-bookworm@sha256:32096e84705b30bb39cc9c65ef2896efacc4268203b7876049847763cefc934d"
    working_dir: /workspace
    command:
      - go
      - run
      - ./cmd/operator
      - -mode
      - fake
      - -listen
      - 0.0.0.0:50081
      - -scheduler
      - scheduler:50051
      - -control
      - job-controller:50061
      - -runtime
      - runtime:50071
      - -cursor-dir
      - /state
    environment:
      CGO_ENABLED: "0"
    volumes:
      - ./cmd:/workspace/cmd:ro
      - ./gen/go:/workspace/gen/go:ro
      - ./go.mod:/workspace/go.mod:ro
      - ./go.sum:/workspace/go.sum:ro
      - ./operator-go:/workspace/operator-go:ro
      - operator-state:/state
      - go-build-cache:/root/.cache/go-build
      - go-module-cache:/go/pkg/mod
    ports:
      - "127.0.0.1:50081:50081"
    depends_on:
      job-controller:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -ec 'exec 3<>/dev/tcp/127.0.0.1/50081'"]
      interval: 1s
      timeout: 1s
      retries: 60
      start_period: 10s
    init: true

  gateway:
    image: "python:3.12.14-slim-bookworm@sha256:0f5b26b9518d002b6173fd61daad821fa340635ebfec5bba471013f9ca114579"
    working_dir: /workspace
    command:
      - /bin/sh
      - -ceu
      - |
        python -m venv /tmp/tgsrl-venv
        /tmp/tgsrl-venv/bin/python -m pip install --disable-pip-version-check uv==0.11.30
        export UV_PROJECT_ENVIRONMENT=/tmp/tgsrl-project-venv
        /tmp/tgsrl-venv/bin/uv sync --frozen --no-dev --no-install-project
        PYTHONPATH=/workspace:/workspace/runtime-python:/workspace/gateway-python:/workspace/gen/python \
          /tmp/tgsrl-venv/bin/uv run --frozen --no-dev --no-sync \
          python -m tgsrl_gateway serve \
          --host 0.0.0.0 --port 8080 --backend-mode grpc \
          --job-control-target job-controller:50061 \
          --scheduler-target scheduler:50051 \
          --runtime-target runtime:50071 \
          --experiment-target runtime:50071
    volumes:
      - ./pyproject.toml:/workspace/pyproject.toml:ro
      - ./uv.lock:/workspace/uv.lock:ro
      - ./gateway-python:/workspace/gateway-python:ro
      - ./gen/python:/workspace/gen/python:ro
      - uv-cache:/root/.cache/uv
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      operator:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - python -c 'import urllib.request; urllib.request.urlopen("http://127.0.0.1:8080/health", timeout=2)'
      interval: 1s
      timeout: 3s
      retries: 60
      start_period: 20s
    init: true

  console:
    image: "node:24.16.0-bookworm-slim@sha256:2c87ef9bd3c6a3bd4b472b4bec2ce9d16354b0c574f736c476489d09f560a203"
    working_dir: /workspace/console
    command:
      - /bin/sh
      - -ceu
      - npm ci && exec npm run dev -- --host 0.0.0.0
    environment:
      VITE_TGSRL_API_ADAPTER: http
      VITE_TGSRL_GATEWAY_TARGET: http://gateway:8080
    volumes:
      - ./console:/workspace/console:ro
      - console-modules:/workspace/console/node_modules
    ports:
      - "127.0.0.1:4173:4173"
    depends_on:
      gateway:
        condition: service_healthy
    init: true

volumes:
  scheduler-state: {}
  controller-state: {}
  runtime-state: {}
  operator-state: {}
  go-build-cache: {}
  go-module-cache: {}
  uv-cache: {}
  console-modules: {}
