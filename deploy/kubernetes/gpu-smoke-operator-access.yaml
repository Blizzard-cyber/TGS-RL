apiVersion: v1
kind: ServiceAccount
metadata:
  name: tgsrl-external-operator
  namespace: tgsrl-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: tgsrl-external-operator-discovery
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["list"]
  - apiGroups: ["node.k8s.io"]
    resources: ["runtimeclasses"]
    verbs: ["list"]
  - apiGroups: ["resource.k8s.io"]
    resources: ["deviceclasses", "resourceslices"]
    verbs: ["list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: tgsrl-external-operator-discovery
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: tgsrl-external-operator-discovery
subjects:
  - kind: ServiceAccount
    name: tgsrl-external-operator
    namespace: tgsrl-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: tgsrl-external-operator
  namespace: tgsrl-system
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["resource.k8s.io"]
    resources: ["resourceclaims"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["resource.k8s.io"]
    resources: ["resourceclaimtemplates"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["kueue.x-k8s.io"]
    resources: ["workloads"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["tgsrl.io"]
    resources: ["jobrunbundles"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["tgsrl.io"]
    resources: ["jobrunbundles/status"]
    verbs: ["get", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: tgsrl-external-operator
  namespace: tgsrl-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: tgsrl-external-operator
subjects:
  - kind: ServiceAccount
    name: tgsrl-external-operator
    namespace: tgsrl-system
