apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: jobrunbundles.tgsrl.io
spec:
  group: tgsrl.io
  scope: Namespaced
  names:
    plural: jobrunbundles
    singular: jobrunbundle
    kind: JobRunBundle
    shortNames:
      - jrb
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required:
                - bundle
              properties:
                bundle:
                  type: object
                  x-kubernetes-preserve-unknown-fields: true
            status:
              type: object
              properties:
                phase:
                  type: string
                reason:
                  type: string
                observedGeneration:
                  type: integer
                  format: int64
                appliedGeneration:
                  type: integer
                  format: int64
                fingerprint:
                  type: string
