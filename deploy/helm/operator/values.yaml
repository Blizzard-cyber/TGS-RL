image:
  repository: tgsrl-operator
  # The tag is a local-development default only. Production releases must set
  # digest to an immutable sha256 value; digest takes precedence over tag.
  tag: "0.1.0"
  digest: ""
  pullPolicy: IfNotPresent

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  fsGroupChangePolicy: OnRootMismatch
  seccompProfile:
    type: RuntimeDefault

securityContext:
  runAsNonRoot: true
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

namespaceOverride: ""

serviceAccount:
  create: true
  name: tgsrl-operator

controller:
  fakeBackend: false
  schedulerAddress: tgsrl-scheduler:50051
  controlAddress: tgsrl-job-controller:50061
  runtimeAddress: tgsrl-runtime:50071
  listenHost: 0.0.0.0
  gpuProfile: none
  runtimeClassName: ""
  runtimeClassHandler: ""
  runtimeClassCreate: false
  nodeSelector: {}
  workerBootstrap:
    enabled: false
    installerImage: ""
    registryURL: ""
    registrySigningKeySecret: ""
    registrySigningKeyKey: signing-key
    verifyDeviceIdentities: false
    hostNetwork: false

service:
  type: ClusterIP
  port: 50081

# Durable state is enabled by default because decision-cursor.json, delivery.json,
# and backend-controls.json are required to recover safely after a pod restart.
persistence:
  enabled: true
  existingClaim: ""
  mountPath: /var/lib/tgsrl-operator
  storageClass: ""
  accessModes:
    - ReadWriteOnce
  size: 1Gi
  # Keep chart-managed state when a release is uninstalled. Delete the PVC
  # explicitly only after deciding that operator recovery state is disposable.
  retain: true
