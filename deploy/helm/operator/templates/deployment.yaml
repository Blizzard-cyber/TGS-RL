apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.serviceAccount.name }}
  namespace: {{ default .Release.Namespace .Values.namespaceOverride }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Values.serviceAccount.name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Values.serviceAccount.name }}
        app.kubernetes.io/part-of: tgsrl
    spec:
      serviceAccountName: {{ .Values.serviceAccount.name }}
      securityContext:
{{ toYaml .Values.podSecurityContext | indent 8 }}
      containers:
        - name: operator
          image: "{{ .Values.image.repository }}{{ if .Values.image.digest }}@{{ .Values.image.digest }}{{ else }}:{{ .Values.image.tag }}{{ end }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
{{ toYaml .Values.securityContext | indent 12 }}
          args:
            - --mode={{ ternary "fake" "kubernetes" .Values.controller.fakeBackend }}
            - --controller=true
            - --scheduler={{ .Values.controller.schedulerAddress }}
            - --control={{ .Values.controller.controlAddress }}
            - --runtime={{ .Values.controller.runtimeAddress }}
            - --listen={{ .Values.controller.listenHost }}:{{ .Values.service.port }}
            - --namespace={{ default .Release.Namespace .Values.namespaceOverride }}
            - --gpu-profile={{ .Values.controller.gpuProfile }}
{{ if .Values.controller.runtimeClassName }}
            - --runtime-class-name={{ .Values.controller.runtimeClassName }}
{{ end }}
{{ if .Values.controller.runtimeClassHandler }}
            - --runtime-class-handler={{ .Values.controller.runtimeClassHandler }}
{{ end }}
{{ if .Values.controller.runtimeClassCreate }}
            - --runtime-class-create=true
{{ end }}
{{ range $key, $value := .Values.controller.nodeSelector }}
            - --node-selector={{ $key }}={{ $value }}
{{ end }}
{{ if .Values.controller.workerBootstrap.enabled }}
            - --worker-bootstrap=true
            - --worker-bootstrap-image={{ .Values.controller.workerBootstrap.installerImage }}
            - --worker-registry-url={{ .Values.controller.workerBootstrap.registryURL }}
            - --worker-registry-signing-key-file=/var/run/secrets/tgsrl-worker-registry/signing-key
            - --worker-verify-device-identities={{ .Values.controller.workerBootstrap.verifyDeviceIdentities }}
{{ if .Values.controller.workerBootstrap.hostNetwork }}
            - --worker-host-network=true
{{ end }}
{{ end }}
            - --cursor-dir={{ .Values.persistence.mountPath }}
          ports:
            - name: grpc
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          readinessProbe:
            tcpSocket:
              port: grpc
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: grpc
            periodSeconds: 10
          volumeMounts:
            - name: cursor-state
              mountPath: {{ .Values.persistence.mountPath }}
{{ if .Values.controller.workerBootstrap.enabled }}
            - name: worker-registry-signing-key
              mountPath: /var/run/secrets/tgsrl-worker-registry
              readOnly: true
{{ end }}
      volumes:
        - name: cursor-state
{{ if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ default (printf "%s-state" .Values.serviceAccount.name) .Values.persistence.existingClaim }}
{{ else }}
          emptyDir: {}
{{ end }}
{{ if .Values.controller.workerBootstrap.enabled }}
        - name: worker-registry-signing-key
          secret:
            secretName: {{ required "controller.workerBootstrap.registrySigningKeySecret is required when worker bootstrap is enabled" .Values.controller.workerBootstrap.registrySigningKeySecret }}
            items:
              - key: {{ .Values.controller.workerBootstrap.registrySigningKeyKey }}
                path: signing-key
{{ end }}
