apiVersion: apps/v1
kind: Deployment
metadata:
  name: tgsrl-job-controller
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app.kubernetes.io/name: tgsrl-job-controller}
  template:
    metadata:
      labels: {app.kubernetes.io/name: tgsrl-job-controller, app.kubernetes.io/part-of: tgsrl}
    spec:
      serviceAccountName: tgsrl-control-plane
      automountServiceAccountToken: false
      securityContext:
{{ include "tgsrl.podSecurityContext" . | indent 8 }}
{{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
{{ toYaml . | indent 8 }}
{{- end }}
      containers:
        - name: job-controller
          image: {{ include "tgsrl.image" (list .Values.jobController.image) | quote }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          securityContext:
{{ include "tgsrl.securityContext" . | indent 12 }}
          args:
            - --listen=0.0.0.0:{{ .Values.jobController.service.grpcPort }}
            - --runtime-target=tgsrl-runtime:{{ .Values.runtime.service.grpcPort }}
            - --state-dir=/var/lib/tgsrl-job-controller
          ports:
            - {name: grpc, containerPort: {{ .Values.jobController.service.grpcPort }}, protocol: TCP}
          readinessProbe:
            tcpSocket: {port: grpc}
            periodSeconds: 5
          livenessProbe:
            tcpSocket: {port: grpc}
            periodSeconds: 10
          volumeMounts:
            - {name: state, mountPath: /var/lib/tgsrl-job-controller}
      volumes:
        - name: state
{{ include "tgsrl.stateVolume" (list . "tgsrl-job-controller" .Values.jobController.persistence) | indent 10 }}
---
apiVersion: v1
kind: Service
metadata:
  name: tgsrl-job-controller
spec:
  selector: {app.kubernetes.io/name: tgsrl-job-controller}
  ports:
    - {name: grpc, port: {{ .Values.jobController.service.grpcPort }}, targetPort: grpc}
