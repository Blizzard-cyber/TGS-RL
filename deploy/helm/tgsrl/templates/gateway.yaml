apiVersion: apps/v1
kind: Deployment
metadata:
  name: tgsrl-gateway
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: tgsrl-gateway}
  template:
    metadata:
      labels: {app.kubernetes.io/name: tgsrl-gateway, app.kubernetes.io/part-of: tgsrl}
    spec:
      serviceAccountName: tgsrl-control-plane
      automountServiceAccountToken: false
      securityContext:
{{ include "tgsrl.podSecurityContext" . | indent 8 }}
{{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
{{ toYaml . | indent 8 }}
{{- end }}
      containers:
        - name: gateway
          image: {{ include "tgsrl.image" (list .Values.gateway.image) | quote }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          securityContext:
{{ include "tgsrl.securityContext" . | indent 12 }}
          args:
            - --host=0.0.0.0
            - --port={{ .Values.gateway.service.port }}
            - --backend-mode=grpc
            - --job-control-target=tgsrl-job-controller:{{ .Values.jobController.service.grpcPort }}
            - --scheduler-target=tgsrl-scheduler:{{ .Values.scheduler.service.grpcPort }}
            - --runtime-target=tgsrl-runtime:{{ .Values.runtime.service.grpcPort }}
            - --experiment-target=tgsrl-runtime:{{ .Values.runtime.service.grpcPort }}
          ports:
            - {name: http, containerPort: {{ .Values.gateway.service.port }}, protocol: TCP}
          readinessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 5
          livenessProbe:
            tcpSocket: {port: http}
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: tgsrl-gateway
spec:
  type: {{ .Values.gateway.service.type }}
  selector: {app.kubernetes.io/name: tgsrl-gateway}
  ports:
    - {name: http, port: {{ .Values.gateway.service.port }}, targetPort: http}
