apiVersion: apps/v1
kind: Deployment
metadata:
  name: tgsrl-console
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: tgsrl-console}
  template:
    metadata:
      labels: {app.kubernetes.io/name: tgsrl-console, app.kubernetes.io/part-of: tgsrl}
    spec:
      serviceAccountName: tgsrl-control-plane
      automountServiceAccountToken: false
      securityContext:
{{ include "tgsrl.podSecurityContext" . | indent 8 }}
{{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
{{ toYaml . | indent 8 }}
{{- end }}
      containers:
        - name: console
          image: {{ include "tgsrl.image" (list .Values.console.image) | quote }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          securityContext:
{{ include "tgsrl.securityContext" . | indent 12 }}
          env:
            - {name: HOST, value: 0.0.0.0}
            - {name: PORT, value: {{ .Values.console.service.port | quote }}}
            - {name: TGSRL_GATEWAY_URL, value: "http://tgsrl-gateway:{{ .Values.gateway.service.port }}"}
          ports:
            - {name: http, containerPort: {{ .Values.console.service.port }}, protocol: TCP}
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: tgsrl-console
spec:
  type: {{ .Values.console.service.type }}
  selector: {app.kubernetes.io/name: tgsrl-console}
  ports:
    - {name: http, port: {{ .Values.console.service.port }}, targetPort: http}
