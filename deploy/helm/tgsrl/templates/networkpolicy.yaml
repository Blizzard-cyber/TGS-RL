{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: tgsrl-control-plane-ingress
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/part-of: tgsrl
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/part-of: tgsrl
        - podSelector:
            matchLabels:
              tgsrl.io/managed-by: operator-go
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: tgsrl-console-ingress
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: tgsrl-console
  policyTypes: [Ingress]
  ingress:
    - ports:
        - {port: {{ .Values.console.service.port }}, protocol: TCP}
{{- end }}
