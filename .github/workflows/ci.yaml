name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: "ci-${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  proto:
    name: Proto contracts
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Install Buf 1.47.2
        uses: bufbuild/buf-setup-action@9672cee01808979ea1249f81d6d321217b9a10f6 # v1.47.2
        with:
          version: "1.47.2"
          github_token: "${{ github.token }}"
      - name: Lint contracts
        run: buf lint
      - name: Check generated files
        run: make check-generated
      - name: Check backward compatibility
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: "${{ github.event.pull_request.base.sha }}"
        run: |
          if git cat-file -e "${BASE_SHA}:buf.yaml" && \
             git cat-file -e "${BASE_SHA}:proto"; then
            baseline_dir="$(mktemp -d)"
            trap 'rm -rf "${baseline_dir}"' EXIT
            git archive "${BASE_SHA}" buf.yaml proto | tar -x -C "${baseline_dir}"
            buf breaking . --against "${baseline_dir}"
          else
            echo "No protobuf baseline exists at ${BASE_SHA}; skipping the first breaking comparison."
          fi

  go:
    name: Go services
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install Go from go.mod
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Verify formatting and static checks
        run: |
          test -z "$(gofmt -l scheduler-go job-controller-go operator-go storage cmd)"
          go vet ./gen/go/... ./scheduler-go/... ./job-controller-go/... ./operator-go/... ./storage/... ./scripts ./cmd/...
      - name: Test with the race detector
        run: make race
      - name: Build scheduler
        run: go build -trimpath -o /tmp/tgsrl-scheduler ./scheduler-go/cmd/scheduler
      - name: Build job controller
        run: go build -trimpath -o /tmp/tgsrl-job-controller ./job-controller-go/cmd/job-controller
      - name: Build operator
        run: go build -trimpath -o /tmp/tgsrl-operator ./cmd/operator

  python:
    name: Python runtime and gateway
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install Go from go.mod
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Install Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12.14"
      - name: Install uv 0.11.30
        uses: astral-sh/setup-uv@b75a909f75acd358c2196fb9a5f1299a9a8868a4 # v6.7.0
        with:
          version: "0.11.30"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Sync locked dependencies
        run: uv sync --frozen
      - name: Lint and type-check
        run: |
          uv run --frozen ruff format --check adapters runtime-python gateway-python tests/python tests/api tests/storage tests/e2e
          uv run --frozen ruff check adapters runtime-python gateway-python tests/python tests/api tests/storage tests/e2e
          uv run --frozen mypy adapters runtime-python/tgsrl_runtime gateway-python/tgsrl_gateway tests/python tests/api tests/storage tests/e2e
      - name: Test
        run: uv run --frozen pytest tests/python tests/api tests/storage tests/governance
      - name: Validate SQLite migrations
        run: make check-migrations
      - name: Run deterministic fixture demo
        run: uv run --frozen python -m tgsrl_runtime.demo > /tmp/tgsrl-demo.json

  governance:
    name: Dependency and compatibility governance
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Install Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12.14"
      - name: Install uv 0.11.30
        uses: astral-sh/setup-uv@b75a909f75acd358c2196fb9a5f1299a9a8868a4 # v6.7.0
        with:
          version: "0.11.30"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Sync locked dependencies
        run: uv sync --frozen
      - name: Validate deterministic SBOM and compatibility claims
        run: make check-governance
      - name: Check public repository content
        run: make check-public-content

  deploy:
    name: Deploy contracts and operator image
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install Helm 3.18.6
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
        with:
          version: v3.18.6
      - name: Validate Operator deployment contracts
        run: make check-deploy
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
      - name: Build multi-platform operator image
        run: |
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --file Dockerfile.operator \
            --tag tgsrl-operator:ci \
            --output type=oci,dest=/tmp/tgsrl-operator.oci .
          python3 scripts/check-oci-platforms.py \
            /tmp/tgsrl-operator.oci linux/amd64 linux/arm64
      - name: Load amd64 operator image
        run: |
          docker buildx build \
            --platform linux/amd64 \
            --file Dockerfile.operator \
            --tag tgsrl-operator:ci \
            --load .
      - name: Smoke test operator image
        run: docker run --rm tgsrl-operator:ci -h

  demo:
    name: Process E2E
    runs-on: ubuntu-24.04
    needs:
      - go
      - python
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install Go from go.mod
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Install Python 3.12.14
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12.14"
      - name: Install uv 0.11.30
        uses: astral-sh/setup-uv@b75a909f75acd358c2196fb9a5f1299a9a8868a4 # v6.7.0
        with:
          version: "0.11.30"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Sync locked dependencies
        run: uv sync --frozen
      - name: Run process E2E
        run: |
          make proto-roundtrip
          make demo

  product-e2e:
    name: Product E2E
    runs-on: ubuntu-24.04
    needs:
      - proto
      - go
      - deploy
      - python
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install Go from go.mod
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Install Python 3.12.14
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12.14"
      - name: Install uv 0.11.30
        uses: astral-sh/setup-uv@b75a909f75acd358c2196fb9a5f1299a9a8868a4 # v6.7.0
        with:
          version: "0.11.30"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Sync locked dependencies
        run: uv sync --frozen
      - name: Run complete product flow
        run: make product-e2e
      - name: Validate Compose topology
        run: docker compose config -q

  console:
    name: Web console
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24.16.0"
          cache: npm
          cache-dependency-path: console/package-lock.json
      - name: Install dependencies
        working-directory: console
        run: npm ci
      - name: Verify console
        working-directory: console
        run: |
          npm run typecheck
          npm run lint
          npm test
          npm run build
