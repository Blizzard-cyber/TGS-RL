name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: "ci-${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  proto:
    name: Proto contracts
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install Buf 1.72.0
        uses: bufbuild/buf-setup-action@a47c93e0b1648d5651a065437926377d060baa99 # v1.50.0
        with:
          version: "1.72.0"
          github_token: "${{ github.token }}"
      - name: Lint contracts
        run: buf lint
      - name: Check generated files
        run: make check-generated
      - name: Check backward compatibility
        env:
          BASE_SHA: "${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}"
        run: |
          if [ "${BASE_SHA}" != "0000000000000000000000000000000000000000" ] && \
             git cat-file -e "${BASE_SHA}:buf.yaml" && \
             git cat-file -e "${BASE_SHA}:proto"; then
            baseline_dir="$(mktemp -d)"
            trap 'rm -rf "${baseline_dir}"' EXIT
            git archive "${BASE_SHA}" buf.yaml proto | tar -x -C "${baseline_dir}"
            buf breaking . --against "${baseline_dir}"
          else
            echo "No protobuf baseline exists at ${BASE_SHA}; skipping the first breaking comparison."
          fi

  go:
    name: Go services
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Go from go.mod
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Verify formatting and static checks
        run: |
          test -z "$(gofmt -l internal scheduler-go job-controller-go operator-go storage cmd)"
          go vet ./gen/go/... ./internal/... ./scheduler-go/... ./job-controller-go/... ./operator-go/... ./storage/... ./scripts ./cmd/...
      - name: Install staticcheck v0.7.0
        run: go install honnef.co/go/tools/cmd/staticcheck@v0.7.0
      - name: Run staticcheck
        run: make staticcheck
      - name: Test with the race detector
        run: make race
      - name: Build scheduler
        run: go build -trimpath -o /tmp/tgsrl-scheduler ./scheduler-go/cmd/scheduler
      - name: Build NVIDIA binding helper
        run: go build -trimpath -o /tmp/tgsrl-nvidia-binding ./cmd/tgsrl-nvidia-binding
      - name: Build NVIDIA runtime helper
        run: go build -trimpath -o /tmp/tgsrl-nvidia-runtime ./cmd/tgsrl-nvidia-runtime
      - name: Build NVIDIA MIG helper
        run: go build -trimpath -o /tmp/tgsrl-nvidia-mig ./cmd/tgsrl-nvidia-mig
      - name: Build workload bootstrap
        run: go build -trimpath -o /tmp/tgsrl-worker-bootstrap ./cmd/tgsrl-worker-bootstrap
      - name: Build job controller
        run: go build -trimpath -o /tmp/tgsrl-job-controller ./job-controller-go/cmd/job-controller
      - name: Build operator
        run: go build -trimpath -o /tmp/tgsrl-operator ./cmd/operator

  performance:
    name: Performance budgets
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Go from go.mod
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Enforce non-race performance budgets
        run: make test-performance

  python:
    name: Python runtime and gateway
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Go from go.mod
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Install Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.14"
      - name: Install uv 0.12.7
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.7"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Sync locked dependencies
        run: uv sync --frozen
      - name: Lint and type-check
        run: |
          uv run --frozen ruff format --check adapters runtime-python gateway-python tests/python tests/api tests/storage tests/e2e tests/governance scripts
          uv run --frozen ruff check adapters runtime-python gateway-python tests/python tests/api tests/storage tests/e2e tests/governance scripts
          uv run --frozen mypy adapters runtime-python/tgsrl_runtime gateway-python/tgsrl_gateway tests/python tests/api tests/storage tests/e2e
      - name: Test
        run: uv run --frozen pytest tests/python tests/api tests/storage tests/governance
      - name: Validate SQLite migrations
        run: make check-migrations
      - name: Run deterministic fixture demo
        run: uv run --frozen python -m tgsrl_runtime.demo > /tmp/tgsrl-demo.json

  governance:
    name: Dependency and compatibility governance
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.14"
      - name: Install uv 0.12.7
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.7"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Sync locked dependencies
        run: uv sync --frozen
      - name: Validate deterministic SBOM and compatibility claims
        run: make check-governance
      - name: Validate E1-E8 campaign contract
        run: make gate-campaign
      - name: Check public repository content
        run: make check-public-content

  deploy:
    name: Deploy contracts and release images
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Helm 4.2.4
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.2.4
      - name: Validate Operator deployment contracts
        run: make check-deploy
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Build multi-platform operator image
        run: |
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --file Dockerfile.operator \
            --tag tgsrl-operator:ci \
            --output type=oci,dest=/tmp/tgsrl-operator.oci .
          python3 scripts/check-oci-platforms.py \
            /tmp/tgsrl-operator.oci linux/amd64 linux/arm64
      - name: Build multi-platform workload bootstrap image
        run: |
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --file Dockerfile.worker-bootstrap \
            --tag tgsrl-worker-bootstrap:ci \
            --output type=oci,dest=/tmp/tgsrl-worker-bootstrap.oci .
          python3 scripts/check-oci-platforms.py \
            /tmp/tgsrl-worker-bootstrap.oci linux/amd64 linux/arm64
      - name: Build multi-platform control-plane images
        run: |
          for target in scheduler job-controller runtime gateway console; do
            docker buildx build \
              --platform linux/amd64,linux/arm64 \
              --file Dockerfile.services \
              --target "${target}" \
              --tag "tgsrl-${target}:ci" \
              --output "type=oci,dest=/tmp/tgsrl-${target}.oci" .
            python3 scripts/check-oci-platforms.py \
              "/tmp/tgsrl-${target}.oci" linux/amd64 linux/arm64
          done
      - name: Load amd64 operator image
        run: |
          docker buildx build \
            --platform linux/amd64 \
            --file Dockerfile.operator \
            --tag tgsrl-operator:ci \
            --load .
      - name: Smoke test operator image
        run: docker run --rm tgsrl-operator:ci -h
      - name: Load and smoke test workload bootstrap image
        run: |
          docker buildx build \
            --platform linux/amd64 \
            --file Dockerfile.worker-bootstrap \
            --tag tgsrl-worker-bootstrap:ci \
            --load .
          docker run --rm tgsrl-worker-bootstrap:ci || test $? -eq 1
      - name: Load and smoke test control-plane images
        run: |
          for target in scheduler job-controller runtime gateway console; do
            docker buildx build \
              --platform linux/amd64 \
              --file Dockerfile.services \
              --target "${target}" \
              --tag "tgsrl-${target}:ci" \
              --load .
          done
          docker run --rm tgsrl-scheduler:ci -h >/tmp/tgsrl-scheduler-help 2>&1
          grep -F -- '-worker-registry-listen' /tmp/tgsrl-scheduler-help
          docker run --rm tgsrl-job-controller:ci -h >/tmp/tgsrl-job-controller-help 2>&1
          grep -F -- '-runtime-target' /tmp/tgsrl-job-controller-help
          docker run --rm tgsrl-runtime:ci --help | grep -F -- '--scheduler-target'
          docker run --rm tgsrl-gateway:ci --help | grep -F -- '--backend-mode'
          console_id=$(docker run --detach --rm --publish 127.0.0.1::8080 tgsrl-console:ci)
          trap 'docker stop "${console_id}" >/dev/null 2>&1 || true' EXIT
          console_port=$(docker port "${console_id}" 8080/tcp | sed 's/.*://')
          console_ready=0
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error "http://127.0.0.1:${console_port}/healthz"; then
              console_ready=1
              break
            fi
            if ! docker inspect "${console_id}" --format '{{.State.Running}}' | grep -qx true; then
              docker logs "${console_id}"
              exit 1
            fi
            sleep 1
          done
          test "${console_ready}" -eq 1
          curl --fail --silent --show-error "http://127.0.0.1:${console_port}/" | grep -F '<title>TGS-RL 训练控制台</title>'

  demo:
    name: Process E2E
    runs-on: ubuntu-24.04
    needs:
      - go
      - python
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Go from go.mod
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Install Python 3.12.14
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.14"
      - name: Install uv 0.12.7
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.7"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Sync locked dependencies
        run: uv sync --frozen
      - name: Run process E2E
        run: |
          make proto-roundtrip
          make demo

  product-e2e:
    name: Product E2E
    runs-on: ubuntu-24.04
    needs:
      - proto
      - go
      - deploy
      - python
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Go from go.mod
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Install Python 3.12.14
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.14"
      - name: Install uv 0.12.7
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.7"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Sync locked dependencies
        run: uv sync --frozen
      - name: Run complete product flow
        run: make product-e2e
      - name: Validate Compose topology
        run: docker compose config -q
      - name: Start local product stack
        run: docker compose up -d --build --wait
      - name: Smoke test local product stack
        run: |
          curl --fail --silent --show-error http://127.0.0.1:8080/health
          curl --fail --silent --show-error http://127.0.0.1:8080/v1/capabilities
          curl --fail --silent --show-error http://127.0.0.1:4173/ | grep -F '<title>TGS-RL 训练控制台</title>'
      - name: Print Compose logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Stop local product stack
        if: always()
        run: docker compose down

  gate-cpu:
    name: Full-stack CPU Gate
    runs-on: ubuntu-24.04
    needs:
      - go
      - python
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Go from go.mod
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Install Python 3.12.14
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.14"
      - name: Install uv 0.12.7
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.7"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Sync locked dependencies
        run: uv sync --frozen
      - name: Run full-stack CPU Gate
        run: make gate-cpu-integration
      - name: Upload Gate evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gate-gi-full-stack-cpu
          if-no-files-found: error
          path: |
            .cache/tgsrl/gate-gi-process/report.json
            .cache/tgsrl/gate-gi-process/artifacts/raw/archive.tar.gz
            .cache/tgsrl/gate-gi-process/artifacts/logs/**
            .cache/tgsrl/gate-gi-process/artifacts/traces/*.json

  console:
    name: Web console
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.20.0"
          cache: npm
          cache-dependency-path: console/package-lock.json
      - name: Install dependencies
        working-directory: console
        run: npm ci
      - name: Verify console
        working-directory: console
        run: |
          npm run typecheck
          npm run lint
          npm test
          npm run build
      - name: Install Chromium
        working-directory: console
        run: npx playwright install --with-deps chromium
      - name: Smoke test all Console routes
        working-directory: console
        run: npm run test:browser
