name: Hardware Validation

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Execution mode"
        required: true
        default: "ci-simulator"
        type: choice
        options:
          - ci-simulator
          - cpu-integration
          - gpu-single-node

permissions:
  contents: read

jobs:
  simulator:
    name: Gate G/I simulator
    if: ${{ github.event.inputs.mode == 'ci-simulator' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Python 3.12.14
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.14"
      - name: Run simulator
        run: |
          python3 scripts/gate-tools.py simulate
          python3 scripts/gate-tools.py report
          python3 scripts/gate-tools.py evaluate > /tmp/gate-evaluation.json
      - name: Assert simulator never claims a real GPU pass
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path("/tmp/gate-evaluation.json").read_text(encoding="utf-8"))
          if data["status"] == "PASSED":
              raise SystemExit("simulator must not claim gate passed")
          print(json.dumps(data, indent=2, sort_keys=True))
          PY
      - name: Upload simulated artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gate-gi-simulated
          path: |
            .cache/tgsrl/gate-gi/report.json
            .cache/tgsrl/gate-gi/artifacts/raw/archive.tar.gz
            .cache/tgsrl/gate-gi/artifacts/traces/*.json

  cpu-integration:
    name: Gate G/I CPU integration smoke
    if: ${{ github.event.inputs.mode == 'cpu-integration' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Python 3.12.14
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.14"
      - name: Install locked dependencies
        run: |
          python -m pip install uv==0.12.7
          uv sync --frozen
      - name: Capture CPU smoke evidence
        run: |
          uv run --frozen python scripts/gate-tools.py cpu-smoke --smoke-command "python -c 'print(\"cpu smoke\")'"
          uv run --frozen python scripts/gate-tools.py report
          uv run --frozen python scripts/gate-tools.py evaluate
      - name: Upload CPU artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gate-gi-cpu-integration
          path: |
            .cache/tgsrl/gate-gi/report.json
            .cache/tgsrl/gate-gi/artifacts/raw/archive.tar.gz
            .cache/tgsrl/gate-gi/artifacts/traces/*.json

  gpu-runner:
    name: Gate G/I GPU workload runner
    if: ${{ github.event.inputs.mode == 'gpu-single-node' }}
    runs-on: [self-hosted, gpu]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Python 3.12.14
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.14"
      - name: Install locked dependencies
        run: |
          python -m pip install uv==0.12.7
          uv sync --frozen
      - name: Execute locked GPU workload and evaluate
        run: |
          nvidia-smi -L
          uv run --frozen python scripts/gate-tools.py hardware-run --evidence GPU_SINGLE_NODE
          uv run --frozen python scripts/gate-tools.py report
          uv run --frozen python scripts/gate-tools.py evaluate
      - name: Upload GPU evidence bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gate-gi-${{ github.event.inputs.mode }}
          path: |
            .cache/tgsrl/gate-gi/report.json
            .cache/tgsrl/gate-gi/artifacts/raw/archive.tar.gz
            .cache/tgsrl/gate-gi/artifacts/traces/*.json
