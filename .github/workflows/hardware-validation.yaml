name: Hardware Validation

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Execution mode"
        required: true
        default: "ci-simulator"
        type: choice
        options:
          - ci-simulator
          - cpu-integration
          - gpu-single-node
          - e1-e8-run
          - e1-e8-evaluate
      evidence_run_id:
        description: "Workflow run ID containing gate-e1-e8-evidence (campaign mode only)"
        required: false
        type: string

permissions:
  actions: read
  contents: read

jobs:
  simulator:
    name: Gate G/I simulator
    if: ${{ github.event.inputs.mode == 'ci-simulator' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Python 3.12.14
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.14"
      - name: Run simulator
        run: |
          python3 scripts/gate-tools.py simulate
          python3 scripts/gate-tools.py report
          python3 scripts/gate-tools.py evaluate > /tmp/gate-evaluation.json
      - name: Assert simulator never claims a real GPU pass
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path("/tmp/gate-evaluation.json").read_text(encoding="utf-8"))
          if data["status"] == "PASSED":
              raise SystemExit("simulator must not claim gate passed")
          print(json.dumps(data, indent=2, sort_keys=True))
          PY
      - name: Upload simulated artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gate-gi-simulated
          path: |
            .cache/tgsrl/gate-gi/report.json
            .cache/tgsrl/gate-gi/artifacts/raw/archive.tar.gz
            .cache/tgsrl/gate-gi/artifacts/traces/*.json

  cpu-integration:
    name: Gate G/I full-stack CPU integration
    if: ${{ github.event.inputs.mode == 'cpu-integration' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Python 3.12.14
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.14"
      - name: Install Go from go.mod
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Install locked dependencies
        run: |
          python -m pip install uv==0.12.7
          uv sync --frozen
      - name: Capture full-stack CPU evidence
        run: |
          make gate-cpu-integration
      - name: Upload CPU artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gate-gi-cpu-integration
          path: |
            .cache/tgsrl/gate-gi-process/report.json
            .cache/tgsrl/gate-gi-process/artifacts/raw/archive.tar.gz
            .cache/tgsrl/gate-gi-process/artifacts/logs/**
            .cache/tgsrl/gate-gi-process/artifacts/traces/*.json

  gpu-runner:
    name: GPU workload conformance (not Gate G/I)
    if: ${{ github.event.inputs.mode == 'gpu-single-node' }}
    runs-on: [self-hosted, gpu]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Python 3.12.14
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.14"
      - name: Install locked dependencies
        run: |
          python -m pip install uv==0.12.7
          uv sync --frozen
      - name: Execute locked GPU workload and evaluate
        run: |
          nvidia-smi -L
          uv run --frozen python scripts/gate-tools.py hardware-run --evidence GPU_SINGLE_NODE
          uv run --frozen python scripts/gate-tools.py report
          uv run --frozen python scripts/gate-tools.py evaluate > /tmp/gate-evaluation.json
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path("/tmp/gate-evaluation.json").read_text(encoding="utf-8"))
          if data["status"] == "PASSED":
              raise SystemExit("reference CUDA workload must not claim a full-system Gate pass")
          print(json.dumps(data, indent=2, sort_keys=True))
          PY
      - name: Upload GPU evidence bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gate-gi-${{ github.event.inputs.mode }}
          path: |
            .cache/tgsrl/gate-gi/report.json
            .cache/tgsrl/gate-gi/artifacts/raw/archive.tar.gz
            .cache/tgsrl/gate-gi/artifacts/traces/*.json

  campaign:
    name: E1-E8 campaign evidence evaluation
    if: ${{ github.event.inputs.mode == 'e1-e8-evaluate' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Python 3.12.14
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.14"
      - name: Validate evidence source
        env:
          EVIDENCE_RUN_ID: ${{ github.event.inputs.evidence_run_id }}
        run: |
          case "${EVIDENCE_RUN_ID}" in
            ''|*[!0-9]*) echo 'evidence_run_id must be a numeric workflow run ID' >&2; exit 1 ;;
          esac
      - name: Download E1-E8 evidence artifact
        uses: actions/download-artifact@3c213e43f68338c8b4d0a2e01e7f4f741d787faf # v8.0.1
        with:
          name: gate-e1-e8-evidence
          path: .cache/tgsrl/e1-e8
          run-id: ${{ github.event.inputs.evidence_run_id }}
          github-token: ${{ github.token }}
      - name: Require the complete E1-E8 campaign to pass
        run: |
          python3 scripts/gate-tools.py campaign-evaluate \
            --campaign configs/gates/e1-e8.json \
            --reports-dir .cache/tgsrl/e1-e8 \
            --output .cache/tgsrl/e1-e8/campaign-report.json \
            --require-pass
      - name: Upload campaign summary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gate-e1-e8-summary
          path: .cache/tgsrl/e1-e8/campaign-report.json

  campaign-runner:
    name: Execute E1-E8 hardware campaign
    if: ${{ github.event.inputs.mode == 'e1-e8-run' }}
    runs-on: [self-hosted, gpu]
    environment: hardware-validation
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install Python 3.12.14
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.14"
      - name: Install locked dependencies
        run: |
          python -m pip install uv==0.12.7
          uv sync --frozen
      - name: Execute and require the complete campaign
        env:
          CAMPAIGN_DRIVER: ${{ vars.TGSRL_CAMPAIGN_DRIVER || 'tgsrl-hardware-environment-driver' }}
        run: |
          test -z "$(git status --porcelain --untracked-files=normal)"
          uv run --frozen python scripts/gate-tools.py campaign-run \
            --campaign configs/gates/e1-e8.json \
            --reports-dir .cache/tgsrl/e1-e8 \
            --driver "${CAMPAIGN_DRIVER}" \
            --require-pass
      - name: Upload E1-E8 evidence and execution summary
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gate-e1-e8-evidence
          if-no-files-found: error
          path: |
            .cache/tgsrl/e1-e8/campaign-execution.json
            .cache/tgsrl/e1-e8/campaign-report.json
            .cache/tgsrl/e1-e8/e*/report.json
            .cache/tgsrl/e1-e8/e*/artifacts/**
