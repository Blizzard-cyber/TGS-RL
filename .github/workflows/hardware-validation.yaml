name: Hardware Validation

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Execution mode"
        required: true
        default: "ci-simulator"
        type: choice
        options:
          - ci-simulator
          - cpu-integration
          - gpu-manual

permissions:
  contents: read

jobs:
  simulator:
    name: Gate G/I simulator
    if: ${{ github.event.inputs.mode == 'ci-simulator' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Python 3.12.14
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.14"
      - name: Run simulator
        run: |
          python3 scripts/gate-tools.py simulate
          python3 scripts/gate-tools.py report
          python3 scripts/gate-tools.py evaluate > /tmp/gate-evaluation.json
      - name: Assert simulator never claims a real GPU pass
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path("/tmp/gate-evaluation.json").read_text(encoding="utf-8"))
          if data["status"] == "PASSED":
              raise SystemExit("simulator must not claim gate passed")
          print(json.dumps(data, indent=2, sort_keys=True))
          PY
      - name: Upload simulated artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gate-gi-simulated
          path: |
            .cache/tgsrl/gate-gi/report.json
            .cache/tgsrl/gate-gi/artifacts/raw/archive.tar.gz
            .cache/tgsrl/gate-gi/artifacts/traces/*.json

  cpu-integration:
    name: Gate G/I CPU integration smoke
    if: ${{ github.event.inputs.mode == 'cpu-integration' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Python 3.12.14
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.14"
      - name: Capture CPU smoke evidence
        run: |
          python3 scripts/gate-tools.py cpu-smoke --smoke-command "python -c 'print(\"cpu smoke\")'"
          python3 scripts/gate-tools.py report
          python3 scripts/gate-tools.py evaluate
      - name: Upload CPU artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gate-gi-cpu-integration
          path: |
            .cache/tgsrl/gate-gi/report.json
            .cache/tgsrl/gate-gi/artifacts/raw/archive.tar.gz
            .cache/tgsrl/gate-gi/artifacts/traces/*.json

  gpu-manual:
    name: Gate G/I manual GPU entry
    if: ${{ github.event.inputs.mode == 'gpu-manual' }}
    runs-on: [self-hosted, gpu]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Manual operator instructions
        run: |
          echo "Manual GPU validation entry."
          echo "1. Capture environment fingerprint:"
          echo "   python3 scripts/gate-tools.py fingerprint --execution-mode gpu-manual"
          echo "2. Initial gate posture is NOT_RUN until a real external run record is produced."
          echo "3. Produce the baseline/variant traces and an external run record."
          echo "4. Create an external JSON run record with simulated=false, GPU_* evidence, hardware fingerprint, and required artifact paths."
          echo "5. Ingest and evaluate:"
          echo "   python3 scripts/gate-tools.py ingest --report /path/to/real-gpu-report.json"
          echo "   python3 scripts/gate-tools.py report"
          echo "   python3 scripts/gate-tools.py evaluate"
          echo "The simulator path must not be used to claim a real GPU gate pass."
