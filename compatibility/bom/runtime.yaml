  path: "compatibility/sbom/lockfiles.spdx.json"
  generator: "scripts/generate-sbom.py"
  inputs:
    - "go.mod"
    - "go.sum"
    - "uv.lock"
    - "console/package-lock.json"
    - "configs/hardware/gpu-requirements.lock"

registered_patches: []
patch_ledger: "upstream/patches.json"

host_tooling:
  note: >-
    Host versions used for the local verification profile. Compose and release
    inputs remain independently pinned above.
  docker_engine: "29.6.1"
  docker_compose: "5.2.0"
  helm: "4.2.4"
  kubectl: "1.35.1"
  minikube: "1.38.1"
  nvidia_driver_minimum: "580.95.05"
  nvidia_container_toolkit_minimum: "1.18.0"
  nvidia_dra_driver_gpu: "0.5.0"
  node_feature_discovery: "0.18.3"

external_integration_targets:
  note: >-
    These are interoperability targets, not installed dependencies or verified
    hardware claims. Real support still requires the compatibility matrix and
    matching evidence.
  kubernetes: "1.35.1"
  kueue: "0.19.2"
  verl: "0.9.0"
  openrlhf: "0.11.0"
  ray: "2.58.0"
  pytorch: "2.13.0"
  vllm: "0.28.0"
  sglang: "0.5.18"
  nvidia_device_plugin: "0.20.0"
  nvidia_dra_driver_gpu: "0.5.0"
  # H1 uses this immutable chart archive; TGS-RL still does not vendor HAMi.
  hami_chart_version: "2.10.0"
  hami_chart_sha256: "e1d8429b2270da1a5c26343d6d6fd2a0099ba7b944cf0f52eb20d6b9f14e5099"
  hami_source_commit: "4707fb02c91c545bc7343ce26dba4c32919f9a3e"
  # Later upstream protocol reference used when reviewing annotation compatibility.
  hami_protocol_commit: "88b118e565a9effaa27f81669da291c5508fc5e4"

claims:
  lockfiles_audited: true
  sbom_generated: true
  development_container_images_pinned: true
  release_container_images_pinned: false
  # E1 proves single-node Full GPU DRA/bootstrap/trace. Independent H1 proves one
  # HAMi fractional workload. MIG, MPS, HAMi concurrency, multi-node and E2-E8
  # remain separate evidence requirements.
  gpu_stack_integrated: true
