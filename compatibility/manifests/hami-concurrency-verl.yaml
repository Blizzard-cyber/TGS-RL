schema_version: "tgsrl.io/compatibility-manifest/v1alpha1"
manifest_id: "hami-concurrency-verl"
revision: 1
status: "implemented-hardware-verification-pending"
scope: "single-node two-worker HAMi fractional-GPU concurrency smoke"

references:
  bom: "compatibility/bom/runtime.yaml"
  profile: "compatibility/profiles/hami-smoke-verl-v1.yaml"
  capabilities: "configs/capabilities/nvidia-gpu-smoke.yaml"
  policy: "configs/policies/static.yaml"
  representative_scenario: "configs/scenarios/hami-concurrency-verl.yaml"
  patch_ledger: "upstream/patches.json"
  compatibility_matrix: "compatibility/matrix.json"

protocol:
  protobuf_package: "tgsrl.v1"
  protocol_release: "v0.3"
  northbound_api_version: null
  execution_contract_versions:
    - "1.0.0"

combination:
  framework:
    name: "verl"
    version: "0.9.0"
  execution_backend:
    name: "ray"
    version: "2.58.0"
  trainer:
    name: "pytorch"
    version: "2.13.0"
  rollout_engine:
    name: "vllm"
    version: "0.28.0"
  resource_provider:
    name: "nvidia"
    source: "nvidia"
  kubernetes:
    enabled: true
    version: "1.35.1"
  gpu_management_profile: "hami-vgpu"

declared_matrix:
  algorithms:
    - "grpo"
  rollout_modes:
    - "partially_async"
  data_kinds:
    - "live"
  evidence_status: "gpu-single-node"
  evidence:
    - "docs/validation/h2-hami-concurrency-2026-09-13.md"

verification_commands:
  preflight: "make gpu-hami-status"
  smoke: "make gpu-hami-concurrency-smoke"

limitations:
  single_node_only: true
  two_workers_only: true
  minimal_smoke_trainer_only: true
  mps: false
  mig: false
  performance_claims_allowed: false
